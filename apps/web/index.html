<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Studio</title>
    <script>
      // Apply the theme before first paint so a dark preference never flashes light. Mirrors
      // src/state/theme.ts: the stored value is the JSON-encoded preference under "studio.theme".
      ;(() => {
        let preference = "system"
        try {
          const stored = window.localStorage.getItem("studio.theme")
          if (stored) preference = JSON.parse(stored)
        } catch (_) {}
        const dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
