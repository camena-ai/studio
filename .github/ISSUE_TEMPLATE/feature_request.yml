name: Feature request
description: Propose a change or an addition to the Studio clients
title: "[area] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Replace `[area]` in the title** with the tag matching the dropdown below.

        Worth knowing before you write: the clients follow a fixed architecture, and the gateway and
        server-side behaviour live in a separate repository. Proposals get shaped down more often than
        up, so lead with the problem.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which surface would this touch? Use the same tag at the start of the title.
      options:
        - "[web] apps/web: the Vite + React SPA"
        - "[desktop] apps/desktop: the Electron shell, local engine, encrypted cache"
        - "[ui] packages/ui: design tokens, shadcn/ui, shared components"
        - "[repo] governance: CI, branch protection, tooling"
        - "[docs] docs, design, README"
        - "not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Studio makes hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
    validations:
      required: true

  - type: textarea
    id: smallest
    attributes:
      label: The smallest version of this
      description: If only part of it shipped, which part carries most of the value?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
    validations:
      required: false
