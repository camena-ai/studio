# pnpm workspaces + Turborepo (D20). Every dependency version is exact and lives in the catalog
# below; bump it there, one commit per upgrade. The hoisted linker is required by electron-builder.
packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
saveExact: true
# Set explicitly so the rule is strict: an install that would pick a version younger than 24 h
# fails in CI and prompts in a terminal. pnpm's built-in default is non-strict and silently
# appends such versions to minimumReleaseAgeExclude instead. Never add exclusions; wait.
minimumReleaseAge: 1440
# TEMPORARY: @camena-ai/contracts 0.1.0 is younger than 24 h until 2026-09-25 06:19:21 UTC.
# Revert this commit after that time and before the pull request merges.
minimumReleaseAgeExclude:
  - "@camena-ai/contracts@0.1.0"
engineStrict: true

# pnpm runs no lifecycle scripts unless the package is allowed here (pnpm 12 fails the install
# on any undecided script). Electron's postinstall downloads its binary; esbuild's installs the
# platform binary for Vite. electron-winstaller fetches Squirrel.Windows tooling that only the
# Windows packaging step needs, so it is explicitly disallowed. turbo's postinstall picks its
# platform binary.
allowBuilds:
  electron: true
  esbuild: true
  turbo: true
  electron-winstaller: false

catalog:
  # Effect: `effect` and `@effect/atom-react` must stay on the same exact version (D22, §12.1).
  effect: 4.0.0-rc.117
  "@effect/atom-react": 4.0.0-rc.117
  "@effect/vitest": 4.0.0-rc.117
  # Web (D21)
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@tanstack/react-router": 1.170.38
  "@tanstack/router-plugin": 1.168.40
  streamdown: 2.6.0
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  vite: 8.3.0
  "@vitejs/plugin-react": 6.1.1
  jsdom: 30.1.1
  "@playwright/test": 1.63.0
  # UI kit (D21): shadcn/ui Radix flavour and its runtime dependencies. No font packages: the
  # OFL is not on the license allowlist, so the type stack is system-ui.
  radix-ui: 1.6.7
  lucide-react: 1.47.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.7
  # Desktop (D16). node-llama-cpp and better-sqlite3-multiple-ciphers join with the milestone-8 spike.
  electron: 44.4.3
  electron-builder: 26.15.3
  electron-updater: 6.8.9
  # Tooling (D20). Versions must be at least 24 h old: pnpm's default minimumReleaseAge applies.
  typescript: 7.0.2
  "@biomejs/biome": 2.5.14
  turbo: 2.11.2
  vitest: 5.0.1
  "@types/node": 26.6.2
