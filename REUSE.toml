# REUSE 3.3 aggregate annotation instead of per-file headers (platform architecture doc, D20 and §12.1).
# Vendored third-party files (shadcn/ui and AI Elements registry items included) get their own
# [[annotations]] entry with the upstream SPDX id; the CI license allowlist covers npm dependencies.
version = 1
SPDX-PackageName = "studio"
SPDX-PackageSupplier = "Camena"
SPDX-PackageDownloadLocation = "https://github.com/camena-ai/studio"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Camena"
SPDX-License-Identifier = "Apache-2.0"

# shadcn/ui registry items vendored through the shadcn CLI (`pnpm dlx shadcn add`), unchanged
# except for import-alias rewrites. Upstream: https://github.com/shadcn-ui/ui (MIT).
[[annotations]]
path = [
  "packages/ui/src/components/ui/**",
  "packages/ui/src/hooks/use-mobile.ts",
  "packages/ui/src/styles/shadcn-variants.css",
]
precedence = "override"
SPDX-FileCopyrightText = "2023 shadcn"
SPDX-License-Identifier = "MIT"

# shadcn/ui registry items vendored through the shadcn CLI (`pnpm dlx shadcn add`), unchanged
# except for import-alias rewrites. Upstream: https://github.com/shadcn-ui/ui (MIT).
[[annotations]]
path = [
  "packages/ui/src/components/ui/**",
  "packages/ui/src/hooks/use-mobile.ts",
  "packages/ui/src/styles/shadcn-variants.css",
]
precedence = "override"
SPDX-FileCopyrightText = "2023 shadcn"
SPDX-License-Identifier = "MIT"
